<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat AI Model</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            display: flex;
        }
        .left-panel, .right-panel {
            flex: 1;
            padding: 20px;
        }
        .left-panel {
            border-right: 1px solid #ccc;
        }
        form {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-top: 10px;
        }
        input, textarea, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
        }
        #loading {
            display: none;
            font-size: 18px;
            color: blue;
        }
        #response {
            white-space: pre-wrap;
            border: 1px solid #ccc;
            padding: 10px;
            margin-top: 10px;
            height: 600px;
            overflow-y: auto;
        }
        #processing-time {
            margin-top: 10px;
            font-size: 16px;
            color: green;
            display: none;
        }
    </style>
</head>
<body>
    <h1>Chat AI Model</h1>
    <div class="container">
        <div class="left-panel">
            <form id="chat-form">
                <label for="model">選擇模型:</label>
                <select id="model" name="model" required>
                    <option value="anthropic.claude-3-5-sonnet-20240620-v1:0">anthropic.claude-3-5-sonnet-20240620-v1:0</option>
                    <option value="anthropic.claude-3-haiku-20240307-v1:0">anthropic.claude-3-haiku-20240307-v1:0</option>
                </select>
                <label for="conversation_and_prompt">對話與提示詞:</label>
                <textarea id="conversation_and_prompt" name="conversation_and_prompt" rows="8" cols="50" required></textarea>
                <label for="max_tokens">max_tokens (最大 4096):</label>
                <input type="number" id="max_tokens" name="max_tokens" min="1" max="4096" value="4096" required>
                <label for="temperature">temperature (0.0 - 1.0):</label>
                <input type="number" id="temperature" name="temperature" min="0" max="1" step="0.1" value="0.3" required>
                <p>temperature: 控制生成文本的隨機性。值越高，生成的文本越隨機；值越低，生成的文本越保守。</p>
                <label for="top_p">top_p (0.0 - 1.0):</label>
                <input type="number" id="top_p" name="top_p" min="0" max="1" step="0.1" value="0.7" required>
                <p>top_p: 控制生成文本的多樣性。值越高，生成的文本越多樣；值越低，生成的文本越集中。</p>
                <label for="file">上傳檔案:</label>
                <input type="file" id="file" name="file">
                <button type="submit" id="submit-btn">送出</button>
            </form>
            <div id="loading">處理中，請稍候...</div>
            <p>提示：如果提示詞越多，需求越複雜，回覆時間也會成正比增加。</p>
        </div>
        <div class="right-panel">
            <h2>回應:</h2>
            <div id="response"></div>
            <button id="download-btn" style="display: none;">下載結果</button>
            <button id="copy-btn" style="display: none;">複製結果</button>
            <div id="processing-time"></div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            $('#chat-form').on('submit', function(event) {
                event.preventDefault();
                var formData = new FormData(this);
                $('#loading').show();
                $('#response').text('');
                $('#download-btn').hide();
                $('#copy-btn').hide();
                $('#submit-btn').prop('disabled', true);
                $('#processing-time').hide();
                var startTime = new Date().getTime();
                $.ajax({
                    url: '/process',
                    type: 'POST',
                    data: formData,
                    processData: false,
                    contentType: false,
                    success: function(data) {
                        $('#loading').hide();
                        $('#submit-btn').prop('disabled', false);
                        var endTime = new Date().getTime();
                        var processingTime = (endTime - startTime) / 1000;
                        $('#processing-time').text('處理時間: ' + processingTime + ' 秒').show();
                        if (data.response) {
                            $('#response').text(data.response);
                            $('#download-btn').show();
                            $('#copy-btn').show();
                            $('#download-btn').off('click').on('click', function() {
                                var blob = new Blob([data.response], { type: 'text/plain' });
                                var url = URL.createObjectURL(blob);
                                var a = document.createElement('a');
                                a.href = url;
                                a.download = 'ai_response.txt';
                                document.body.appendChild(a);
                                a.click();
                                document.body.removeChild(a);
                                URL.revokeObjectURL(url);
                            });
                            $('#copy-btn').off('click').on('click', function() {
                                var text = $('#response').text();
                                navigator.clipboard.writeText(text).then(function() {
                                    alert('結果已複製到剪貼簿');
                                }, function(err) {
                                    alert('複製失敗: ' + err);
                                });
                            });
                        } else if (data.error) {
                            $('#response').text('Error: ' + data.error);
                        }
                    },
                    error: function(jqXHR, textStatus, errorThrown) {
                        $('#loading').hide();
                        $('#submit-btn').prop('disabled', false);
                        $('#response').text('Error: ' + textStatus);
                    }
                });
            });

            $('#file').on('change', function() {
                if ($(this).val()) {
                    $('#conversation_and_prompt').prop('required', false);
                } else {
                    $('#conversation_and_prompt').prop('required', true);
                }
            });
        });
    </script>
</body>
</html>
